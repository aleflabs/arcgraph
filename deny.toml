# cargo-deny configuration.
# Enforces workspace Apache-2.0 licensing policy: Apache 2.0 throughout.
# Run: cargo deny check

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    # NOTE on dropped allowances (W25-M4-61b housekeeping; PR #465
    # R1 NIT-1 closure): `Unicode-DFS-2016`, `0BSD`, and
    # `CDLA-Permissive-2.0` were dropped because `cargo deny check
    # licenses` reported them as `license-not-encountered` against
    # the current dependency graph. Re-add an allowance only alongside
    # the dependency that requires it and an Apache-2.0 compatibility
    # justification.
]
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0190: downcast-rs 2.0.2 `Error::downcast_mut()` unsoundness
# (UB when `Error::context` is followed by `downcast_mut`). UNSOUND-class
# (informational), NOT a CVE. Transitive-only via tantivy 0.26.1; we use
# downcast-rs nowhere directly. NO FIX PUBLISHED (2.0.2 is the latest
# downcast-rs; tantivy 0.26.1 is the latest tantivy — no bump clears it).
# Our only `downcast_mut` calls are `std::any::Any` on BoltHeldTxn
# (substrate.rs, ADR-197), a different API — the advisory's exact UB
# sequence is unreachable from our code. Re-evaluate when downcast-rs
# publishes a fix or tantivy drops the dep. (mgr-support 2026-06-29, #1241)
#
# RUSTSEC-2024-0436: `paste` 1.0.15 unmaintained-not-vulnerable. The crate's
# author archived the repo; this is an UNMAINTAINED advisory, NOT a CVE — no
# code-execution or memory-safety risk, and "No safe upgrade is available".
# Transitive-only via tokenizers 0.23.1 → macro_rules_attribute 0.2.2 → paste
# in an upstream test dependency; we use `paste` nowhere directly. No fix clears it
# until tokenizers drops macro_rules_attribute. Tracked for removal when
# tokenizers publishes a paste-free release. (mgr-dev 2026-07-03, #1345)
ignore = ["RUSTSEC-2026-0190", "RUSTSEC-2024-0436"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are declared as path-deps without an
# explicit `version`, which cargo-deny treats as wildcards. Allow
# that pattern so the ban catches only EXTERNAL crate wildcards
# (e.g. `serde = "*"`), which is what we actually want to forbid.
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
