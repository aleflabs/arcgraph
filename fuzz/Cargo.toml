path = "fuzz_targets/secondary_index_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migrate_cypher_fuzz"
path = "fuzz_targets/migrate_cypher_fuzz.rs"
test = false
doc = false
bench = false

# ─── ADR-191 (#620): Value::Map JSON-decode (network-reachable) ───────
[[bin]]
name = "value_map_json_fuzz"
path = "fuzz_targets/value_map_json_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_page_fuzz"
path = "fuzz_targets/catalog_page_fuzz.rs"
test = false
doc = false
bench = false

# ─── #1287 (security hardening; #1285 sibling): CommitBundle payload ───
# decoder fuzz target. `decode_commit_bundle_for_version` parses untrusted
# on-disk bytes during crash recovery + spill reload (v5..v8 sectioned
# decoders incl the v8 `acl_grants` tail); no prior fuzz coverage.
[[bin]]
name = "commit_bundle_decoder_fuzz"
path = "fuzz_targets/commit_bundle_decoder_fuzz.rs"
test = false
doc = false
bench = false

# ─── M5-D1 (#1457): leg-(c) fresh-load NATIVE input boundary ────────────
# INV-M5.16 half re-landed with its format (salvaged sound from PR #1504
# per M5D-REDESIGN-AMENDMENT §9); the Parquet boundary + its fuzz target
# land together in a later slice. No new deps: `arcgraph-cli` is already a
# fuzz dependency (migrate_cypher_fuzz).
[[bin]]
name = "m5_native_loader_fuzz"
path = "fuzz_targets/m5_native_loader_fuzz.rs"
test = false
doc = false
bench = false
