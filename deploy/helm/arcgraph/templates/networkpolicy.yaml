{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arcgraph.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arcgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arcgraph.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.mcp.from | nindent 8 }}
      ports:
        {{- if ne .Values.mcp.transport "stdio" }}
        - protocol: TCP
          port: {{ .Values.mcp.http.port }}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arcgraph.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arcgraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arcgraph.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.admin.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "arcgraph.adminPort" . }}
{{- end }}
