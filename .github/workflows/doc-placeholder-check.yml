name: Doc placeholder check

# Closes recurrence channel: PR #151 + PR #153 both shipped unbackfilled
# `PR #N` / `<pending ... PR number>` placeholders in committed docs that
# slipped past human review (caught only at independent reviewer). Issue
# #156 captures the recurrence; this workflow gates the class at the
# system level.
#
# Scope:
#   docs/**/*.md.
# Patterns:
#   - `PR #N` literal, optionally followed by `, YYYY-MM-DD` (closure shape).
#   - `<pending ... PR number>` (the PR #151 §D-9 shape).
#
# Complementary to .github/workflows/ci.yml, which paths-ignores docs/**.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**/*.md'
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  placeholder-check:
    name: Placeholder grep (no `PR #N` in committed docs)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - name: Check for unbackfilled placeholders
        run: |
          set -euo pipefail
          # `grep -r ... || true` so the step does not exit non-zero on
          # the no-match case (grep returns 1 when nothing matches).
          MATCHES=$(grep -rnE 'PR #N(,[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2})?|<pending[^>]*PR number>' \
                       docs/ \
                       --include='*.md' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Unbackfilled PR-number placeholder(s) found in committed docs."
            echo "::error::Pattern: PR #N(, YYYY-MM-DD)? OR <pending ... PR number>"
            echo ""
            echo "$MATCHES"
            echo ""
            echo "Backfill these placeholders to actual PR numbers before merge."
            exit 1
          fi
          echo "OK: no unbackfilled PR-number placeholders in committed docs."
